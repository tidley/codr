name: Build and release

on:
  push:
    branches: [master]
    tags: ['v*']
  pull_request:
  workflow_dispatch:
    inputs:
      source_ref:
        description: 'Source tag or commit to verify and package (blank uses this ref)'
        required: false
        type: string
      linux_preview:
        description: 'Publish a Linux-only prerelease; build the pinned connector from source'
        required: false
        default: false
        type: boolean

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-24.04
    steps:
      - name: Require an immutable source commit for Linux previews
        if: inputs.linux_preview
        env:
          SOURCE_REF: ${{ inputs.source_ref }}
        run: |
          python3 - <<'PY'
          import os, re
          assert re.fullmatch(r'[0-9a-f]{40}', os.environ['SOURCE_REF']), 'Linux previews require source_ref to be a full commit SHA'
          PY
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.source_ref || github.ref }}
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Check release versions
        run: |
          python3 - <<'PY'
          import os
          import tomllib
          from pathlib import Path
          version = tomllib.loads(Path('Cargo.toml').read_text())['package']['version']
          manifest = tomllib.loads(Path('herdr-plugin.toml').read_text())
          assert manifest['version'] == version, 'Cargo and plugin versions differ'
          notes = Path(f'docs/releases/{version}.md')
          assert notes.is_file() and '## Contributors' in notes.read_text(), 'Reviewed release notes and contributor credits are required'
          if os.environ['GITHUB_REF'].startswith('refs/tags/'):
              assert os.environ['GITHUB_REF_NAME'] == 'v' + version, 'Tag and package versions differ'
          PY
      - run: cargo fmt --all --check
      - run: cargo test --locked --tests
      - run: cargo clippy --locked --all-targets -- -D warnings
      - run: python3 -m unittest discover -s tests -p 'test_*.py' -v

  checks-macos:
    if: ${{ !inputs.linux_preview }}
    runs-on: macos-15
    env:
      # /var is a symlink; launch fixtures must use a physical, short temp root.
      TMPDIR: /private/tmp
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.source_ref || github.ref }}
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: cargo test --locked --tests
      - run: python3 -m unittest discover -s tests -p 'test_*.py' -v

  binaries:
    needs: [checks, checks-macos]
    if: ${{ !inputs.linux_preview && (startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch') }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04
            os: linux
            arch: x86_64
            target: x86_64-unknown-linux-musl
          - runner: ubuntu-24.04-arm
            os: linux
            arch: aarch64
            target: aarch64-unknown-linux-musl
          - runner: macos-15
            os: macos
            arch: aarch64
            target: aarch64-apple-darwin
          - runner: macos-15-intel
            os: macos
            arch: x86_64
            target: x86_64-apple-darwin
    runs-on: ${{ matrix.runner }}
    container: ${{ matrix.os == 'linux' && 'ubuntu:22.04' || '' }}
    timeout-minutes: 120
    steps:
      - name: Install native build tools
        if: runner.os == 'Linux'
        run: apt-get update && apt-get install -y build-essential musl-tools pkg-config libssl-dev git curl ca-certificates python3 unzip ripgrep
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.source_ref || github.ref }}
          persist-credentials: false
      - uses: actions/setup-python@v5
        if: runner.os == 'macOS'
        with:
          python-version: '3.11'
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
          components: rustfmt, clippy
      - uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78
        if: runner.os == 'Linux'
      - name: Install portable Python for the Linux container
        if: runner.os == 'Linux'
        run: |
          uv python install 3.11
          dirname "$(uv python find --managed-python 3.11)" >> "$GITHUB_PATH"
      - name: Build and package
        env:
          TARGET: ${{ matrix.target }}
          OS_NAME: ${{ matrix.os }}
          ARCH: ${{ matrix.arch }}
        run: |
          cargo build --locked --release --target "$TARGET"
          "target/$TARGET/release/herdr-white-noise-bridge" --version
          "target/$TARGET/release/herdr-white-noise-bridge" --help > /dev/null
          if [ "$OS_NAME" = linux ]; then
            if readelf -l "target/$TARGET/release/herdr-white-noise-bridge" | grep -q INTERP; then
              echo "The musl bridge unexpectedly requires a runtime loader" >&2
              exit 1
            fi
          fi
          version=$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -1)
          mkdir -p dist
          if [ "$OS_NAME" = macos ]; then
            codesign --force --sign - "target/$TARGET/release/herdr-white-noise-bridge"
            codesign --verify --strict "target/$TARGET/release/herdr-white-noise-bridge"
          fi
          asset="codr-v$version-$OS_NAME-$ARCH.tar.gz"
          tar -czf "dist/$asset" -C "target/$TARGET/release" herdr-white-noise-bridge \
            -C "$GITHUB_WORKSPACE/vendor/mdk" LICENSE README.codr.md \
            -C "$GITHUB_WORKSPACE/vendor/mdk/vendor/hpke-rs-libcrux" LICENSE-MPL-2.0
          if [ "$OS_NAME" = macos ]; then
            shasum -a 256 "dist/$asset" > "dist/$asset.sha256"
          else
            sha256sum "dist/$asset" > "dist/$asset.sha256"
          fi
      - name: Read connector source pin
        id: connector
        run: python3 -c 'import os,tomllib; from pathlib import Path; m=tomllib.loads(Path("connector.toml").read_text()); open(os.environ["GITHUB_OUTPUT"],"a").write("revision="+m["revision"]+"\n")'
      - uses: actions/checkout@v4
        with:
          repository: marmot-protocol/mdk
          ref: ${{ steps.connector.outputs.revision }}
          path: mdk
          persist-credentials: false
      - name: Apply connector patch
        run: python3 scripts/connector_source.py mdk
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: mdk -> target
          shared-key: codr-connector-${{ matrix.os }}-${{ matrix.arch }}
      - name: Test connector protocol and compatibility
        working-directory: mdk
        run: |
          # macOS's default temp path can exceed the Unix socket staging limit.
          if [ "$RUNNER_OS" = macOS ]; then
            export TMPDIR="$(mktemp -d /private/tmp/codr.XXXXXX)"
          fi
          cargo test --locked -p agent-control -p agent-connector -j 2 -- --test-threads=1
      - name: Install upstream verification tools
        if: matrix.os == 'linux' && matrix.arch == 'x86_64'
        uses: taiki-e/install-action@b18fb392e1a1b90971f7c7572c92790fa54f23d5
        with:
          tool: just
      - name: Install jq for upstream policy checks
        if: matrix.os == 'linux' && matrix.arch == 'x86_64'
        run: |
          # Ubuntu 22.04's jq 1.6 rejects the upstream workflow's $label variable.
          curl --fail --location --retry 3 --output "$RUNNER_TEMP/jq" https://github.com/jqlang/jq/releases/download/jq-1.7.1/jq-linux-amd64
          echo "5942c9b0934e510ee61eb3e30273f1b3fe2590df93933a93d7c58b81d19c8ff5  $RUNNER_TEMP/jq" | sha256sum --check -
          install -m 0755 "$RUNNER_TEMP/jq" /usr/local/bin/jq
          test "$(jq --version)" = jq-1.7.1
      - name: Check upstream workspace
        if: matrix.os == 'linux' && matrix.arch == 'x86_64'
        working-directory: mdk
        env:
          CARGO_BUILD_JOBS: '2'
        run: just fast-ci
      - name: Build dedicated connector
        working-directory: mdk
        run: cargo build --locked --release -p agent-connector --bin wn-agent -j 2
      - name: Package dedicated connector
        env:
          ARCH: ${{ matrix.arch }}
          OS_NAME: ${{ matrix.os }}
        run: |
          if [ "$OS_NAME" = macos ]; then
            codesign --force --sign - mdk/target/release/wn-agent
            codesign --verify --strict mdk/target/release/wn-agent
          fi
          mdk/target/release/wn-agent --version
          version=$(python3 -c 'import tomllib; print(tomllib.load(open("Cargo.toml", "rb"))["package"]["version"])')
          asset="codr-wn-agent-v$version-$OS_NAME-$ARCH.tar.gz"
          # Keep connector compatibility/provenance checks, but ship only the
          # combined application executable in the release's dist directory.
          mkdir -p connector-checks
          tar -czf "connector-checks/$asset" -C mdk/target/release wn-agent -C ../.. LICENSE CODR-CONNECTOR.json
          if [ "$OS_NAME" = macos ]; then
            shasum -a 256 "connector-checks/$asset" > "connector-checks/$asset.sha256"
          else
            sha256sum "connector-checks/$asset" > "connector-checks/$asset.sha256"
          fi
          python3 - "$asset" "$version" <<'PY'
          import hashlib, json, sys, tarfile
          from pathlib import Path
          with tarfile.open(Path("connector-checks") / sys.argv[1]) as bundle:
              assert sorted(bundle.getnames()) == ["CODR-CONNECTOR.json", "LICENSE", "wn-agent"]
              provenance = json.load(bundle.extractfile("CODR-CONNECTOR.json"))
          assert provenance["codr_version"] == sys.argv[2]
          assert provenance["patch_sha256"] == hashlib.sha256(Path("patches/mdk-codr.patch").read_bytes()).hexdigest()
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: codr-${{ matrix.os }}-${{ matrix.arch }}
          path: dist/*
          if-no-files-found: error

  linux-preview:
    if: github.event_name == 'workflow_dispatch' && inputs.linux_preview
    needs: checks
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04
            arch: x86_64
            target: x86_64-unknown-linux-musl
          - runner: ubuntu-24.04-arm
            arch: aarch64
            target: aarch64-unknown-linux-musl
    runs-on: ${{ matrix.runner }}
    container: ubuntu:22.04
    timeout-minutes: 120
    steps:
      - name: Install native build tools
        run: apt-get update && apt-get install -y build-essential musl-tools pkg-config libssl-dev git curl ca-certificates python3 unzip
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.source_ref || github.ref }}
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78
      - name: Install portable Python for the Linux container
        run: |
          uv python install 3.11
          dirname "$(uv python find --managed-python 3.11)" >> "$GITHUB_PATH"
      - uses: Swatinem/rust-cache@v2
      - name: Require an explicitly Linux-only plugin checkout
        run: |
          python3 - <<'PY'
          import tomllib
          from pathlib import Path
          manifest = tomllib.loads(Path('herdr-plugin.toml').read_text())
          assert manifest['platforms'] == ['linux'], 'Preview must not advertise unsupported platforms'
          PY
      - name: Build and package Linux bridge
        env:
          TARGET: ${{ matrix.target }}
          ARCH: ${{ matrix.arch }}
        run: |
          cargo build --locked --release --target "$TARGET"
          binary="target/$TARGET/release/herdr-white-noise-bridge"
          version=$(python3 -c 'import tomllib; print(tomllib.load(open("Cargo.toml", "rb"))["package"]["version"])')
          test "$("$binary" --version)" = "herdr-white-noise-bridge $version"
          "$binary" --help > /dev/null
          if readelf -l "$binary" | grep -q INTERP; then
            echo 'Linux bridge must be statically linked' >&2
            exit 1
          fi
          mkdir -p dist
          asset="codr-v$version-linux-$ARCH.tar.gz"
          tar -czf "dist/$asset" -C "target/$TARGET/release" herdr-white-noise-bridge \
            -C "$GITHUB_WORKSPACE/vendor/mdk" LICENSE README.codr.md \
            -C "$GITHUB_WORKSPACE/vendor/mdk/vendor/hpke-rs-libcrux" LICENSE-MPL-2.0
          (cd dist && sha256sum "$asset" > "$asset.sha256")
      - name: Read connector source pin
        id: connector
        run: python3 -c 'import os,tomllib; from pathlib import Path; m=tomllib.loads(Path("connector.toml").read_text()); open(os.environ["GITHUB_OUTPUT"],"a").write("revision="+m["revision"]+"\n")'
      - uses: actions/checkout@v4
        with:
          repository: marmot-protocol/mdk
          ref: ${{ steps.connector.outputs.revision }}
          path: mdk
          persist-credentials: false
      - name: Apply connector patch
        run: python3 scripts/connector_source.py mdk
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: mdk -> target
          shared-key: codr-connector-linux-${{ matrix.arch }}
      - name: Test connector protocol and compatibility
        working-directory: mdk
        run: cargo test --locked -p agent-control -p agent-connector -j 2 -- --test-threads=1
      - name: Build dedicated connector
        working-directory: mdk
        run: cargo build --locked --release -p agent-connector --bin wn-agent -j 2
      - name: Package dedicated connector
        env:
          ARCH: ${{ matrix.arch }}
        run: |
          test "$(mdk/target/release/wn-agent --version)" = "wn-agent $(python3 -c 'import tomllib; print(tomllib.load(open("connector.toml", "rb"))["version"])')"
          version=$(python3 -c 'import tomllib; print(tomllib.load(open("Cargo.toml", "rb"))["package"]["version"])')
          asset="codr-wn-agent-v$version-linux-$ARCH.tar.gz"
          mkdir -p connector-checks
          tar -czf "connector-checks/$asset" -C mdk/target/release wn-agent -C ../.. LICENSE CODR-CONNECTOR.json
          (cd connector-checks && sha256sum "$asset" > "$asset.sha256")
      - uses: actions/upload-artifact@v4
        with:
          name: codr-preview-${{ matrix.arch }}
          path: dist/*
          if-no-files-found: error

  publish-linux-preview:
    if: github.event_name == 'workflow_dispatch' && inputs.linux_preview
    needs: linux-preview
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.source_ref || github.ref }}
          persist-credentials: false
      - uses: actions/download-artifact@v4
        with:
          pattern: codr-preview-*
          merge-multiple: true
          path: dist
      - name: Verify complete Linux assets and publish an opt-in prerelease
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          version=$(python3 -c 'import tomllib; print(tomllib.load(open("Cargo.toml", "rb"))["package"]["version"])')
          python3 - <<'PY'
          import tomllib
          from pathlib import Path
          version = tomllib.loads(Path('Cargo.toml').read_text())['package']['version']
          archives = {f'codr-v{version}-linux-{arch}.tar.gz' for arch in ('x86_64', 'aarch64')}
          assert {path.name for path in Path('dist').iterdir()} == archives | {name + '.sha256' for name in archives}
          PY
          (cd dist && sha256sum -c *.sha256)
          # GITHUB_TOKEN creates this tag without triggering the full tag-build workflow.
          gh release create "v$version" dist/* --target "$(git rev-parse HEAD)" \
            --title "codr v$version — Linux preview" --prerelease --latest=false \
            --notes-file "docs/releases/$version.md"

  release:
    needs: binaries
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/download-artifact@v4
        with:
          pattern: codr-*
          merge-multiple: true
          path: dist
      - name: Publish versioned release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          notes="docs/releases/${GITHUB_REF_NAME#v}.md"
          test -s "$notes"
          gh release create "$GITHUB_REF_NAME" dist/* --title "codr $GITHUB_REF_NAME" --notes-file "$notes" --verify-tag
