[workspace]
resolver = "3"
members = [
    "crates/agent-control",
    "crates/agent-connector",
    "crates/marmot-app",
]

[workspace.package]
edition = "2024"
version = "0.19.0"
license = "MIT"
publish = false

[workspace.dependencies]
# Offline audit-schema validation; never enable remote reference resolution.
jsonschema = { version = "0.56.0", default-features = false }
# OpenMLS family — exact-pinned to an upstream main commit. It carries the
# draft-10 last-resort KeyPackage encoding (openmls#2133), the RustCrypto 0.14 /
# HPKE 0.8 provider (openmls#2249 and #2261; fixes RUSTSEC-2026-0387 and
# RUSTSEC-2026-0330/0331), and the 0.9.1/0.9.2 security fixes, none of which
# any OpenMLS release has together yet.
# Keep every companion crate on the same repository commit to prevent source skew.
# Migration: once an upstream OpenMLS release contains all of them, replace all
# four git entries together with that release series.
openmls = { git = "https://github.com/openmls/openmls.git", rev = "6100df3fb1d8c3eeab53e349fcbd621f98c44fe2", features = ["extensions-draft"] }
openmls_basic_credential = { git = "https://github.com/openmls/openmls.git", rev = "6100df3fb1d8c3eeab53e349fcbd621f98c44fe2" }
openmls_rust_crypto = { git = "https://github.com/openmls/openmls.git", rev = "6100df3fb1d8c3eeab53e349fcbd621f98c44fe2", features = ["extensions-draft"] }
openmls_traits = { git = "https://github.com/openmls/openmls.git", rev = "6100df3fb1d8c3eeab53e349fcbd621f98c44fe2", features = ["extensions-draft"] }
tls_codec = "~0.5"

# async
tokio = { version = "1", features = ["sync", "macros", "rt", "time"] }
tokio-util = { version = "0.7", features = ["io", "rt"] }
async-trait = "0.1"
futures = "0.3"

# proc macros
proc-macro2 = "1"
quote = "1"
syn = { version = "2", features = ["full"] }

# utils
chrono = { version = "0.4", default-features = false, features = ["clock"] }
thiserror = "2"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
hex = "0.4"
base64 = "0.22"
getrandom = "0.4"
web-time = "1.1"
hmac = "0.12"
libc = "0.2"
fs4 = { version = "1.1.0", default-features = false }
hkdf = "0.12"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml_ng = "0.10"
clap = { version = "4.6", features = ["derive"] }
# unstable-rendered-line-info exposes Paragraph::line_count for wrap-aware TUI scroll math.
ratatui = { version = "0.30", features = ["unstable-rendered-line-info"] }
crossterm = "0.28"
# Inbound-media rendering in the TUI. `default-features = false` is load-bearing:
# ratatui-image's defaults pull `chafa-dyn`, which needs the system libchafa C
# library and would break CI and packaging.
ratatui-image = { version = "10", default-features = false, features = ["crossterm"] }
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "gif", "webp"] }
# General-category lookups for the terminal untrusted-text sanitizer (drop the
# whole Cf format class instead of a drifting hardcoded denylist).
unicode-properties = { version = "0.1", default-features = false, features = ["general-category"] }
# Extended grapheme-cluster segmentation for the TUI /react guard (one cluster ==
# one emoji). Already in the tree via ratatui; declared here so wn-cli can depend
# on it directly at the workspace-consistent version.
unicode-segmentation = "1"
rand = "0.8"
sha2 = "0.10"
url = "2"
psl = "2"
chacha20poly1305 = "0.10"
# Device pairing's ephemeral key agreement. Already in the tree through
# OpenMLS's HPKE provider; `static_secrets` lets a test pin the key bytes.
x25519-dalek = { version = "3.0", default-features = false, features = ["precomputed-tables", "static_secrets", "zeroize"] }
openssl = { version = "0.10", features = ["vendored"] }
bytes = "1"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "json", "stream", "socks"] }
async-wsocket = "0.17"
tokio-socks = "0.5.2"
tokio-tungstenite = { version = "0.28", features = ["rustls-tls-webpki-roots"] }
zeroize = "1"
# Recovery words for backups (mdk#2628 4.4): 12 BIP-39 English words. Already
# in the lockfile through nostr's NIP-06 support.
bip39 = { version = "2.2.2", default-features = false, features = ["std", "zeroize"] }
keyring-core = "1"
nostr = { git = "https://github.com/erskingardner/rust-nostr", rev = "e93cc06b5624f06c21ecd8111a124176eb0c7589", default-features = false, features = ["std", "rand", "os-rng", "nip04", "nip49", "nip59"] }
nostr-sdk = { git = "https://github.com/erskingardner/rust-nostr", rev = "e93cc06b5624f06c21ecd8111a124176eb0c7589", features = ["local-relay"] }
nostr-gossip = { git = "https://github.com/erskingardner/rust-nostr", rev = "e93cc06b5624f06c21ecd8111a124176eb0c7589" }
nostr-relay-builder = "0.44"
# OTLP export (behind the marmot-app `otlp-export` feature): map pre-aggregated
# relay telemetry straight to the OTLP protobuf and POST it over the existing
# reqwest/rustls stack, so the SDK's record-time histogram API is not needed.
opentelemetry-proto = { version = "0.32", default-features = false, features = ["gen-tonic-messages", "metrics"] }
prost = "0.14"
rusqlite = { version = "0.40.1", default-features = false, features = ["bundled-sqlcipher-vendored-openssl", "cache", "trace"] }
tempfile = "3"
flate2 = "1"
uuid = { version = "1", features = ["v4"] }

# test
proptest = "1"
insta = { version = "1", features = ["json"] }
stateright = "0.31.0"
criterion = { version = "0.5", features = ["async_tokio"] }

# workspace-internal
fs-private = { git = "https://github.com/marmot-protocol/mdk.git", rev = "3fce95465cdea1edc8456dbd1c6691d1c8dc1f2e" }
media-store = { git = "https://github.com/marmot-protocol/mdk.git", rev = "3fce95465cdea1edc8456dbd1c6691d1c8dc1f2e" }
nostr-directory = { git = "https://github.com/marmot-protocol/mdk.git", rev = "3fce95465cdea1edc8456dbd1c6691d1c8dc1f2e" }
cgka-traits = { git = "https://github.com/marmot-protocol/mdk.git", rev = "3fce95465cdea1edc8456dbd1c6691d1c8dc1f2e" }
cgka-engine = { git = "https://github.com/marmot-protocol/mdk.git", rev = "3fce95465cdea1edc8456dbd1c6691d1c8dc1f2e" }
marmot-session = { git = "https://github.com/marmot-protocol/mdk.git", rev = "3fce95465cdea1edc8456dbd1c6691d1c8dc1f2e" }
storage-sqlite = { git = "https://github.com/marmot-protocol/mdk.git", rev = "3fce95465cdea1edc8456dbd1c6691d1c8dc1f2e" }
sonar-stickers = { version = "0.1.0", features = ["nostr"] }
cgka-conformance-simulator = { git = "https://github.com/marmot-protocol/mdk.git", rev = "3fce95465cdea1edc8456dbd1c6691d1c8dc1f2e" }
transport-nostr-peeler = { git = "https://github.com/marmot-protocol/mdk.git", rev = "3fce95465cdea1edc8456dbd1c6691d1c8dc1f2e" }
transport-nostr-adapter = { git = "https://github.com/marmot-protocol/mdk.git", rev = "3fce95465cdea1edc8456dbd1c6691d1c8dc1f2e" }
transport-nostr = { git = "https://github.com/marmot-protocol/mdk.git", rev = "3fce95465cdea1edc8456dbd1c6691d1c8dc1f2e" }
agent-control = { path = "crates/agent-control" }
marmot-forensics = { git = "https://github.com/marmot-protocol/mdk.git", rev = "3fce95465cdea1edc8456dbd1c6691d1c8dc1f2e" }
marmot-markdown-ast = { git = "https://github.com/marmot-protocol/mdk.git", rev = "3fce95465cdea1edc8456dbd1c6691d1c8dc1f2e" }
marmot-markdown = { git = "https://github.com/marmot-protocol/mdk.git", rev = "3fce95465cdea1edc8456dbd1c6691d1c8dc1f2e" }
marmot-account = { git = "https://github.com/marmot-protocol/mdk.git", rev = "3fce95465cdea1edc8456dbd1c6691d1c8dc1f2e" }
marmot-pairing = { git = "https://github.com/marmot-protocol/mdk.git", rev = "3fce95465cdea1edc8456dbd1c6691d1c8dc1f2e" }
marmot-observability = { git = "https://github.com/marmot-protocol/mdk.git", rev = "3fce95465cdea1edc8456dbd1c6691d1c8dc1f2e" }
marmot-app = { path = "crates/marmot-app" }
marmot-uniffi = { git = "https://github.com/marmot-protocol/mdk.git", rev = "3fce95465cdea1edc8456dbd1c6691d1c8dc1f2e" }
marmot-uniffi-macros = { git = "https://github.com/marmot-protocol/mdk.git", rev = "3fce95465cdea1edc8456dbd1c6691d1c8dc1f2e" }
marmot-terminal-harness = { git = "https://github.com/marmot-protocol/mdk.git", rev = "3fce95465cdea1edc8456dbd1c6691d1c8dc1f2e" }

# hax-lib-macros 0.3.7 still declares the unmaintained proc-macro-error2
# dependency under cfg(hax). Pin the upstream removal until the next hax
# release contains it, then remove this patch and update the libcrux path.
[patch.crates-io]
hax-lib-macros = { git = "https://github.com/cryspen/hax.git", rev = "8f9cb576e58f6cc7e9ed249a7d4439b0f7ed0da7" }
# libsqlite3-sys 0.38.2 still bundles SQLCipher 4.14.0, whose enhanced
# memory-security allocator emits one WARN for every mlock failure. Pin the
# merged 4.17.0 amalgamation until a crates.io release contains that lineage.
libsqlite3-sys = { git = "https://github.com/rusqlite/rusqlite.git", rev = "5ae7fdf83085c595fd54f977b3a56ccacabaf16b" }

# Dev and test builds keep full debug info for workspace crates and skip it for
# dependencies, trimming local compile time and target/ size. CI already builds
# everything with CARGO_PROFILE_{DEV,TEST}_DEBUG=0, so CI artifacts are
# unchanged. `test` inherits these overrides from `dev`.
[profile.dev.package."*"]
debug = false

# Build the bundled SQLCipher C code optimized in dev and test builds too. Every
# test that opens a database replays the migrations, and at -O0 SQLite's own SQL
# parsing was a fifth of the workspace test lane's CPU (mdk#2738). Release
# builds already optimize it.
[profile.dev.package.libsqlite3-sys]
opt-level = 3

# Standard release profile for MarmotKit and other workspace release consumers.
# Thin LTO with one codegen unit is the measured candidate; do not add a custom
# release-size profile, fat LTO, linker-plugin LTO, panic=abort, or opt-level
# change. Host and Apple archives keep strip = "none" so UniFFI metadata and
# native archive members remain. Android JNI builds override strip=symbols on
# those cargo invocations only.
[profile.release]
lto = "thin"
codegen-units = 1
strip = "none"
