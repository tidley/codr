# Reference only. Replace every placeholder with values for the installing user.
# The installation guide generates this file from the user's public npub and bootstrap output.
phone_npub = "npub1REPLACE_WITH_YOUR_WHITE_NOISE_PUBLIC_KEY"
herdr_socket = "/home/YOUR_USER/.config/herdr/herdr.sock"
wn_agent_socket = "/home/YOUR_USER/.marmot-agents/herdr/dev/wn-agent.sock"
# Replace with the dedicated bridge account ID from wn-agent bootstrap.
account_id_hex = "aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa"
state_path = "/home/YOUR_USER/.local/state/herdr-white-noise-bridge/state.json"
opencode_bin = "/absolute/path/to/opencode"
# Optional incremental reader. Select the database for the mapped OpenCode sessions.
# opencode_db = "/home/YOUR_USER/.local/share/opencode/opencode.db"
# Recommended for V2: read the existing local server without starting/recovering it.
# This takes precedence over opencode_db; a failed read retries, with no CLI fallback.
# opencode_service_file = "/home/YOUR_USER/.local/state/opencode/service.json"
# Shared-group @alias admission requires this existing V2 service registration.
# Bind dedicated sessions with local attach-shared-chat, not names/config aliases.
# See docs/SHARED_CHATS.md. Membership never grants invocation or tool approval.
# Optional transcript roots. Defaults use CODEX_HOME / CLAUDE_CONFIG_DIR, or these home directories.
codex_home = "/home/YOUR_USER/.codex"
claude_home = "/home/YOUR_USER/.claude"
# Optional editable progress and transcription notices. Requires MDK edit_message support.
# The published MDK 0.13.0 binaries do not include that API.
# Standalone owner-only control chat for /new and general commands.
# control_chat = true
# edit_responses = true
