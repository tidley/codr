id = "local.white-noise"
name = "White Noise Remote"
version = "0.10.0"
min_herdr_version = "0.9.1"
description = "One encrypted White Noise group per herdr agent session"
platforms = ["linux", "macos"]

[[build]]
command = ["python3", "scripts/install.py"]

[[startup]]
command = ["sh", "plugin-start.sh"]

[[actions]]
id = "setup"
title = "Set up White Noise remote"
contexts = ["workspace"]
command = ["sh", "plugin-setup.sh"]

[[panes]]
id = "setup"
title = "White Noise remote setup"
placement = "tab"
command = ["python3", "scripts/setup.py"]

[[actions]]
id = "start"
title = "Start White Noise remote"
contexts = ["workspace"]
command = ["sh", "plugin-start.sh"]

[[actions]]
id = "status"
title = "White Noise remote status"
contexts = ["workspace"]
command = ["sh", "plugin-status.sh"]

[[actions]]
id = "forwarding"
title = "White Noise forwarding: At desk / Away"
contexts = ["workspace"]
command = ["sh", "plugin-forwarding.sh"]

[[actions]]
id = "toggle-forwarding"
title = "Toggle White Noise forwarding"
contexts = ["workspace"]
command = ["sh", "plugin-forwarding.sh", "toggle"]

[[panes]]
id = "forwarding"
title = "White Noise forwarding"
placement = "popup"
width = "80%"
height = 18
command = ["sh", "plugin-forwarding-menu.sh"]
